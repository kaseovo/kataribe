name: Eval

# Streams real Japanese audio at the Live API. Kept off the push path because it
# runs in real time and costs Gemini credit. The failure it catches is a config
# that only breaks against the live service.
#
# Run by hand: Actions, Eval, Run workflow (or `gh workflow run eval.yml`).
# After topping up the key, after any change to how the interviewer speaks or
# listens, and before a release. It ran nightly until 2026-10-15: every run
# spends credit, and through judging nothing changes from one night to the next.
on:
  workflow_dispatch:

jobs:
  eval:
    # macOS for `say` and `afconvert`, which generate the Japanese fixture audio.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      KATARIBE_GEMINI_API_KEY: ${{ secrets.KATARIBE_GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      # Without the key the live Python tests skip and the browser tests fail
      # for that reason alone. From 2026-09-22 to 2026-10-09 every nightly run
      # did exactly that, and the skips read as a suite that had run.
      - name: Require the Gemini key
        run: |
          if [ -z "$KATARIBE_GEMINI_API_KEY" ]; then
            echo "::error::The KATARIBE_GEMINI_API_KEY secret is not set, so nothing here can talk to Gemini."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
        working-directory: backend

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        id: setup
        working-directory: frontend

      # Each suite runs whatever the one before it did. A model judged to have
      # lapsed once in a conversation says nothing about the browser path, and
      # stopping there would hide whether that works too.
      - run: make eval-api
      - run: make eval-browser
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      # Six minutes of real conversation. Too slow for the on-demand run, but
      # the only thing that covers the session length the product needs.
      - run: pnpm test:endurance
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
